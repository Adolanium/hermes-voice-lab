[package]
name = "voice-lab-engine"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Articulatory vocal tract synthesizer for Hermes Voice Lab"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
